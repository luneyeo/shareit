code_review:
  disable: false
  pull_request_opened:
    summary: true
    code_review: true
ignore_patterns:
  # 1. 패키지 매니저 및 락 파일
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "node_modules/**"

  # 2. 빌드 결과물 및 프레임워크 캐시
  - "node_modules/**"
  - ".next/**"
  - "dist/**"
  - ".git/**"

  # 3. 개발 도구 및 AI 설정 폴덜
  - ".claude/**"
  - ".husky/**"

  # 4. 문서 파일
  - "*.md"
