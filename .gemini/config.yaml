code_review:
  disable: false
  comment_severity_threshold: "LOW" # 기본 HIGH에서 LOW로 변경하여 더 많은 피드백 받기
  pull_request_opened:
    summary: true
    code_review: true
ignore_patterns:
  # 빌드 결과물 및 시스템 폴더
  - "node_modules/**"
  - ".next/**"
  - "dist/**"
  - ".git/**"

  # 패키지 잠금 파일
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"

  # 문서 파일
  - "*.md"
