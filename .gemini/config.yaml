# .gemini/config.yaml
version: "1"
review:
  # 리뷰에서 제외할 파일 패턴 (글롭 패턴 사용)
  rules:
    - exclude:
        paths:
          - "package-lock.json"
          - "yarn.lock"
          - "pnpm-lock.yaml"
          - "dist/**"
          - ".next/**"
          - "node_modules/**"
          - "**/*.png"
          - "**/*.jpg"
          - "**/*.svg"
