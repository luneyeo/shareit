name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 같은 PR에 새 커밋이 푸시되면 진행 중이던 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 코드가 토큰으로 저장소를 조작하지 못하도록 자격 증명을 남기지 않는다.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Format check
        id: format
        continue-on-error: true
        run: pnpm format:check

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build
        env:
          # 빌드 단계에서 Supabase 클라이언트 생성 시 형식만 필요하므로 더미 값을 주입한다.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

      # tsc는 next build가 생성하는 next-env.d.ts(*.png 등 이미지 모듈 선언)에 의존하므로 Build 뒤에 실행한다.
      - name: Type check
        id: type
        continue-on-error: true
        run: pnpm exec tsc --noEmit

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ci-result -->';
            const icon = (o) => (o === 'success' ? '✅ 통과' : '❌ 실패');
            const body = [
              marker,
              '## CI 결과',
              '',
              '| 검사 | 결과 |',
              '| --- | --- |',
              `| Lint | ${icon('${{ steps.lint.outcome }}')} |`,
              `| Format | ${icon('${{ steps.format.outcome }}')} |`,
              `| Type check | ${icon('${{ steps.type.outcome }}')} |`,
              `| Build | ${icon('${{ steps.build.outcome }}')} |`,
              '',
              `자세한 로그: [워크플로 실행 보기](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if any check failed
        if: >-
          steps.lint.outcome != 'success' ||
          steps.format.outcome != 'success' ||
          steps.type.outcome != 'success' ||
          steps.build.outcome != 'success'
        run: exit 1
