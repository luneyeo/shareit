name: Lighthouse Report

# Lighthouse CI 워크플로가 끝나면 그 결과 아티팩트만 받아 PR에 댓글을 단다.
# 이 워크플로는 PR 코드를 체크아웃/실행하지 않으므로, 쓰기 권한을 가져도 안전하다.
# workflow_run은 기본 브랜치 컨텍스트에서 실행되어 포크 PR에도 쓰기 권한이 부여된다.
on:
  workflow_run:
    workflows: [Lighthouse CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download PR comment
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-pr-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr
        if: steps.download.outcome == 'success'
        run: echo "number=$(cat pr-comment/pr-number.txt)" >> "$GITHUB_OUTPUT"

      - name: Read comment body
        id: body
        if: steps.download.outcome == 'success'
        run: |
          {
            echo 'body<<COMMENT_EOF'
            cat pr-comment/body.md
            echo 'COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report result to PR
        if: steps.download.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse-result
          number: ${{ steps.pr.outputs.number }}
          message: ${{ steps.body.outputs.body }}
