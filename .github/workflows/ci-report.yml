name: CI Report

# CI 워크플로가 끝나면 그 결과 아티팩트만 받아 PR에 댓글을 단다.
# 이 워크플로는 PR 코드를 체크아웃/실행하지 않으므로, 쓰기 권한을 가져도 안전하다.
# workflow_run은 기본 브랜치 컨텍스트에서 실행되어 포크 PR에도 쓰기 권한이 부여된다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download PR comment
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-pr-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 아티팩트의 PR 번호는 포크가 위조할 수 있으므로, head SHA로 조회한 실제 PR과 일치하는지 검증한다.
      - name: Resolve and verify PR number
        id: pr
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const claimed = fs.readFileSync('pr-comment/pr-number.txt', 'utf8').trim();
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });
            const match = prs.find((pr) => String(pr.number) === claimed);
            if (!match) {
              core.setFailed(`아티팩트의 PR 번호(${claimed})가 head SHA의 실제 PR과 일치하지 않습니다.`);
              return;
            }
            core.setOutput('number', String(match.number));

      - name: Read comment body
        id: body
        if: steps.download.outcome == 'success'
        run: |
          {
            echo 'body<<COMMENT_EOF'
            cat pr-comment/body.md
            echo 'COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report result to PR
        if: steps.download.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-result
          number: ${{ steps.pr.outputs.number }}
          message: ${{ steps.body.outputs.body }}
