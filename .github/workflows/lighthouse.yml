name: Lighthouse CI

on:
  pull_request:
    branches: [dev]

# 같은 PR에 새 커밋이 푸시되면 진행 중이던 이전 실행을 취소한다.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 코드가 토큰으로 저장소를 조작하지 못하도록 자격 증명을 남기지 않는다.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true
        env:
          # startServerCommand(pnpm start)가 런타임에 참조하므로 동일한 더미 값을 준다.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

      - name: Comment Lighthouse result on PR
        if: always() && steps.lhci.outputs.resultsPath != ''
        uses: actions/github-script@v7
        env:
          RESULTS_PATH: ${{ steps.lhci.outputs.resultsPath }}
          LINKS: ${{ steps.lhci.outputs.links }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const manifestPath = path.join(process.env.RESULTS_PATH, 'manifest.json');
            if (!fs.existsSync(manifestPath)) {
              core.info('manifest.json이 없어 Lighthouse 댓글을 생성하지 않습니다.');
              return;
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const links = JSON.parse(process.env.LINKS || '{}');
            const run = manifest.find((r) => r.isRepresentativeRun) || manifest[0];
            const summary = run ? run.summary : {};

            const labels = {
              performance: 'Performance',
              accessibility: 'Accessibility',
              'best-practices': 'Best practices',
              seo: 'SEO',
              pwa: 'PWA',
            };
            const icon = (v) => (v >= 0.9 ? '🟢' : v >= 0.5 ? '🟠' : '🔴');
            const rows = Object.entries(summary)
              .map(([k, v]) => `| ${labels[k] || k} | ${icon(v)} ${Math.round(v * 100)} |`)
              .join('\n');
            const reportUrl = Object.values(links)[0];
            const linkLine = reportUrl ? `\n[전체 리포트 보기](${reportUrl})` : '';

            const marker = '<!-- lighthouse-result -->';
            const body = `${marker}\n## 🚦 Lighthouse 결과\n\n\`/\` (모바일)\n\n| 항목 | 점수 |\n| --- | --- |\n${rows}\n${linkLine}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
