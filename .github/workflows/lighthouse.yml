name: Lighthouse CI

on:
  pull_request:
    branches: [dev]

# 같은 PR에 새 커밋이 푸시되면 진행 중이던 이전 실행을 취소한다.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

# PR가 제어하는 설치/스크립트가 실행되는 검증 job에는 쓰기 권한을 주지 않는다.
# PR 댓글은 별도 Lighthouse Report 워크플로(workflow_run)에서 게시한다.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 코드가 토큰으로 저장소를 조작하지 못하도록 자격 증명을 남기지 않는다.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true
        env:
          # startServerCommand(pnpm start)가 런타임에 참조하므로 동일한 더미 값을 준다.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

      - name: Build result comment
        id: comment-body
        if: always() && steps.lhci.outputs.manifest != ''
        uses: actions/github-script@v7
        env:
          MANIFEST: ${{ steps.lhci.outputs.manifest }}
          LINKS: ${{ steps.lhci.outputs.links }}
        with:
          script: |
            const manifest = JSON.parse(process.env.MANIFEST || '[]');
            const links = JSON.parse(process.env.LINKS || '{}');
            const run = manifest.find((r) => r.isRepresentativeRun) || manifest[0];
            const summary = run ? run.summary : {};

            const labels = {
              performance: 'Performance',
              accessibility: 'Accessibility',
              'best-practices': 'Best practices',
              seo: 'SEO',
              pwa: 'PWA',
            };
            const icon = (v) => (v >= 0.9 ? '🟢' : v >= 0.5 ? '🟠' : '🔴');

            let rows = Object.entries(summary)
              .map(([k, v]) => `| ${labels[k] || k} | ${icon(v)} ${Math.round(v * 100)} |`)
              .join('\n');

            const reportUrl = Object.values(links)[0];
            const linkLine = reportUrl ? `\n[전체 리포트 보기](${reportUrl})` : '';

            const body = `## 🚦 Lighthouse 결과\n\n\`/\` (모바일)\n\n| 항목 | 점수 |\n| --- | --- |\n${rows}\n${linkLine}`;
            core.setOutput('body', body);

      # 댓글은 여기서 게시하지 않고, 결과와 PR 번호만 아티팩트로 넘겨 Report 워크플로가 게시한다.
      - name: Prepare PR comment
        if: always() && steps.comment-body.outputs.body != ''
        run: |
          mkdir -p pr-comment
          printf '%s' "${{ github.event.pull_request.number }}" > pr-comment/pr-number.txt
          cat > pr-comment/body.md <<'EOF'
          ${{ steps.comment-body.outputs.body }}
          EOF

      - name: Upload PR comment
        if: always() && steps.comment-body.outputs.body != ''
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pr-comment
          path: pr-comment/
